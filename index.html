<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/sql-wasm.js"></script><script>window.Chart&&(Chart.defaults.color="#8fa3c7",Chart.defaults.borderColor="rgba(130,150,210,.22)",Chart.defaults.font.family="Cairo,Tahoma,Arial");</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--b:#0b2a5b;--a:#1e6fd9;--g:#14b8a6;--bg:#04060f;--tx:#e6edff;--mu:#8a9bc4;--bd:rgba(var(--tn),.16);
--t1:color-mix(in srgb,var(--cy) 55%,#1d4ed8);--cy:#22d3ee;--vi:#8b5cf6;--pk:#f472b6;--c1r:34,211,238;--c2r:139,92,246;--gl:rgba(var(--p1),.62);--gl2:rgba(var(--p1),.55);
--p0:5,8,22;--p1:12,20,48;--tn:120,160,255;--sh:0 8px 32px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.06)}
*{box-sizing:border-box}
html{scrollbar-color:#2a3b78 rgb(var(--p0));scrollbar-width:thin}
body{margin:0;font-family:'Cairo',Tahoma,Arial,sans-serif;background:var(--bg);color:var(--tx);font-size:15px;position:relative;min-height:100vh;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-2;background:
radial-gradient(900px 600px at 85% -10%,rgba(var(--c2r),.28),transparent 60%),
radial-gradient(800px 600px at 5% 105%,rgba(var(--c1r),.20),transparent 60%),
radial-gradient(600px 400px at 50% 50%,rgba(30,111,217,.10),transparent 70%),var(--bg)}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
background-image:linear-gradient(rgba(var(--tn),.06) 1px,transparent 1px),linear-gradient(90deg,rgba(var(--tn),.06) 1px,transparent 1px);
background-size:46px 46px;-webkit-mask-image:radial-gradient(ellipse at 50% 30%,#000 20%,transparent 78%);mask-image:radial-gradient(ellipse at 50% 30%,#000 20%,transparent 78%);animation:grid 14s linear infinite}
@keyframes grid{to{background-position:46px 46px,46px 46px}}
::selection{background:var(--vi);color:#fff}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-track{background:rgb(var(--p0))}::-webkit-scrollbar-thumb{background:linear-gradient(var(--cy),var(--vi));border-radius:8px}
:focus-visible{outline:2px solid var(--cy);outline-offset:2px}

/* ---------- Login ---------- */
.login{position:relative;max-width:420px;margin:8vh auto;background:var(--gl);backdrop-filter:blur(22px) saturate(160%);-webkit-backdrop-filter:blur(22px) saturate(160%);padding:38px 32px;border-radius:24px;text-align:center;border:1px solid var(--bd);box-shadow:0 0 0 1px rgba(var(--c1r),.08),0 30px 80px rgba(0,0,0,.6),0 0 80px rgba(var(--c2r),.22);animation:rise .7s cubic-bezier(.2,.8,.2,1)}
.login::before{content:"";position:absolute;inset:-1px;border-radius:25px;padding:1.5px;background:conic-gradient(from var(--ang,0deg),var(--cy),var(--vi),var(--pk),var(--cy));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:spin 6s linear infinite;pointer-events:none}
@property --ang{syntax:"<angle>";inherits:false;initial-value:0deg}
@keyframes spin{to{--ang:360deg}}
@keyframes rise{from{opacity:0;transform:translateY(24px) scale(.97)}to{opacity:1;transform:none}}
body:has(.login){min-height:100vh}
.login img{background:#fff;border-radius:14px;padding:8px 14px;box-shadow:0 0 30px rgba(var(--c1r),.35)}
.login h3{margin:18px 0 4px;font-size:24px;background:linear-gradient(90deg,#fff,var(--cy) 50%,var(--vi));-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:700;letter-spacing:.3px}
.login small{color:var(--mu);letter-spacing:1.2px;font-size:11px;display:block;margin-bottom:10px}
.login p{color:var(--mu);line-height:1.8}
.login button{width:100%;margin-top:10px;padding:12px}

/* ---------- Form controls ---------- */
input,select,textarea,button{font:inherit;padding:10px 14px;border:1px solid var(--bd);border-radius:12px;width:100%;margin:5px 0;background:rgba(var(--p0),.7);color:var(--tx);transition:.2s}
input::placeholder,textarea::placeholder{color:#5d6d96}
select option{background:rgb(var(--p1));color:var(--tx)}
input:focus,select:focus,textarea:focus{border-color:var(--cy);box-shadow:0 0 0 3px rgba(var(--c1r),.16),0 0 22px rgba(var(--c1r),.25);outline:0;background:rgba(var(--p1),.9)}
input[type=date],input[type=time],input[type=month]{color-scheme:dark}
label{font-weight:600;color:#b9c8ee;font-size:13.5px;display:block;margin-top:8px}
button{position:relative;width:auto;background:linear-gradient(135deg,var(--t1),var(--bt2,var(--vi)));color:#fff;border:0;cursor:pointer;padding:9px 18px;font-weight:700;letter-spacing:.2px;box-shadow:0 4px 18px rgba(var(--c2r),.35),inset 0 1px 0 rgba(255,255,255,.25);overflow:hidden}
button::after{content:"";position:absolute;top:0;left:-120%;width:60%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.35),transparent);transform:skewX(-20deg);transition:.6s}
button:hover::after{left:140%}
button:hover{transform:translateY(-2px);filter:brightness(1.12);box-shadow:0 8px 26px rgba(var(--c1r),.4),inset 0 1px 0 rgba(255,255,255,.3)}
button:active{transform:translateY(0) scale(.97)}
button:disabled{opacity:.55;cursor:wait;transform:none}
button.s{background:rgba(var(--tn),.10);color:#cfdcff;border:1px solid var(--bd);box-shadow:none}
button.s:hover{background:rgba(var(--c1r),.14);border-color:rgba(var(--c1r),.5);box-shadow:0 0 18px rgba(var(--c1r),.25)}
button.d{background:linear-gradient(135deg,#ff3d6e,#b3123f);box-shadow:0 4px 18px rgba(255,61,110,.35)}
button.g{background:linear-gradient(135deg,#10d98a,#0a8f6a);box-shadow:0 4px 18px rgba(16,217,138,.3)}
input[type=checkbox]{width:auto;accent-color:var(--cy)}
input[type=checkbox]:focus{box-shadow:none}

/* ---------- Layout ---------- */
.shell{display:flex;min-height:100vh}
.side{overflow-y:auto;width:250px;background:linear-gradient(180deg,rgba(var(--p1),.82),rgba(var(--p0),.9));backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);color:#fff;padding:18px 12px;flex-shrink:0;border-left:1px solid var(--bd);box-shadow:-10px 0 50px rgba(0,0,0,.5);position:relative}
.side::after{content:"";position:absolute;top:0;left:0;width:1px;height:100%;background:linear-gradient(180deg,transparent,var(--cy),var(--vi),transparent);opacity:.7}
.side img{margin-bottom:12px;box-shadow:0 0 28px rgba(var(--c1r),.35);border:1px solid rgba(var(--c1r),.35)}
.side a{position:relative;display:block;color:#a9b9e0;padding:11px 16px;border-radius:12px;cursor:pointer;margin:4px 0;font-weight:600;transition:.25s;border:1px solid transparent;overflow:hidden}
.side a::before{content:"";position:absolute;right:0;top:20%;height:60%;width:3px;border-radius:3px;background:linear-gradient(var(--cy),var(--vi));transform:scaleY(0);transition:.25s}
.side a:hover{background:rgba(var(--tn),.10);color:#fff;transform:translateX(-4px);border-color:var(--bd)}
.side a:hover::before{transform:scaleY(1)}
.side a.on{background:linear-gradient(135deg,rgba(30,111,217,.55),rgba(var(--c2r),.45));color:#fff;border-color:rgba(var(--c1r),.45);box-shadow:0 0 26px rgba(var(--c1r),.28),inset 0 0 18px rgba(255,255,255,.06)}
.side a.on::before{transform:scaleY(1)}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{background:rgba(var(--p0),.62);backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%);padding:12px 24px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--bd);box-shadow:0 8px 30px rgba(0,0,0,.35);position:sticky;top:0;z-index:4;flex-wrap:wrap;gap:8px;color:#cfdcff}
.top::after{content:"";position:absolute;bottom:-1px;right:0;left:0;height:1px;background:linear-gradient(90deg,transparent,var(--cy),var(--vi),transparent);opacity:.8}
.top b{font-size:19px;background:linear-gradient(90deg,#fff,var(--cy));-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:.3px}
.top button{padding:6px 12px}
.top a{color:#dbe6ff;padding:5px 11px;border-radius:20px;background:rgba(var(--tn),.10);border:1px solid var(--bd);transition:.2s}
.top a:hover{background:rgba(var(--c1r),.16);box-shadow:0 0 16px rgba(var(--c1r),.3)}
.pg{padding:24px;flex:1;animation:fade .45s ease}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ---------- Cards & boxes ---------- */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:16px}
.card{--c:var(--cy);background:var(--gl);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:18px;padding:20px;box-shadow:var(--sh);color:var(--mu);font-weight:600;border:1px solid var(--bd);position:relative;overflow:hidden;transition:.3s;animation:rise .6s both}
.card::before{content:"";position:absolute;top:0;right:0;left:0;height:3px;background:linear-gradient(90deg,transparent,var(--c),transparent);box-shadow:0 0 18px var(--c)}
.card::after{content:"";position:absolute;width:120px;height:120px;left:-40px;bottom:-60px;border-radius:50%;background:radial-gradient(circle,var(--c),transparent 70%);opacity:.18;transition:.4s}
.card:hover{transform:translateY(-6px);border-color:var(--c);box-shadow:0 18px 44px rgba(0,0,0,.55),0 0 34px color-mix(in srgb,var(--c) 40%,transparent)}
.card:hover::after{opacity:.4;transform:scale(1.4)}
.card:nth-child(1){--c:#38bdf8;animation-delay:.02s}.card:nth-child(2){--c:#10d98a;animation-delay:.08s}.card:nth-child(3){--c:#fbbf24;animation-delay:.14s}.card:nth-child(4){--c:#a78bfa;animation-delay:.2s}.card:nth-child(5){--c:#22d3ee;animation-delay:.26s}.card:nth-child(6){--c:#f472b6;animation-delay:.32s}.card:nth-child(7){--c:#94a3b8;animation-delay:.38s}
.card b{font-size:34px;color:#fff;display:block;margin-top:8px;text-shadow:0 0 22px var(--c);font-variant-numeric:tabular-nums;letter-spacing:.5px}
.box{background:var(--gl);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:18px;padding:22px;box-shadow:var(--sh);margin-top:16px;overflow-x:auto;border:1px solid var(--bd);position:relative;animation:rise .55s both}
.box h4{margin:0 0 12px;color:#fff;font-size:17px;display:flex;align-items:center;gap:10px}
.box h4::before{content:"";width:4px;height:18px;border-radius:4px;background:linear-gradient(var(--cy),var(--vi));box-shadow:0 0 12px var(--cy)}
.box p,.box small{color:var(--mu)}
canvas{max-width:100%}

/* ---------- Tables ---------- */
table{width:100%;border-collapse:separate;border-spacing:0}
th,td{padding:12px 11px;border-bottom:1px solid rgba(var(--tn),.10);text-align:right;white-space:nowrap}
th{background:rgba(var(--c1r),.07);color:var(--cy);font-weight:700;font-size:12.5px;letter-spacing:.6px;position:sticky;top:0}
th:first-child{border-radius:0 10px 0 0}th:last-child{border-radius:10px 0 0 0}
td{color:#d6e0fb}
tbody tr,table tr{transition:.15s}
table tr:hover td{background:rgba(var(--c1r),.07);color:#fff}
td button{padding:5px 12px;font-size:13px}
td input,td select{margin:0}

/* ---------- Status chips ---------- */
.st{padding:3px 12px;border-radius:20px;font-size:12px;font-weight:700;color:#fff;display:inline-block;border:1px solid transparent;letter-spacing:.3px}
.PENDING{background:rgba(251,191,36,.16);color:#fcd34d;border-color:rgba(251,191,36,.5);box-shadow:0 0 14px rgba(251,191,36,.25)}
.APPROVED{background:rgba(16,217,138,.15);color:#34f0a8;border-color:rgba(16,217,138,.5);box-shadow:0 0 14px rgba(16,217,138,.25)}
.REJECTED{background:rgba(255,61,110,.15);color:#ff7a9c;border-color:rgba(255,61,110,.5);box-shadow:0 0 14px rgba(255,61,110,.25)}
.ACTIVE{background:rgba(var(--c1r),.15);color:#67e8f9;border-color:rgba(var(--c1r),.5);box-shadow:0 0 14px rgba(var(--c1r),.25)}
.COMPLETED{background:rgba(148,163,184,.14);color:#cbd5e1;border-color:rgba(148,163,184,.4)}
.side a .st{margin-right:6px;padding:1px 9px;animation:pulse 2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(251,191,36,0)}0%{box-shadow:0 0 0 0 rgba(251,191,36,.5)}}

/* ---------- Modal / autocomplete / toast ---------- */
#mo{position:fixed;inset:0;background:rgba(var(--p0),.72);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;z-index:9}
#mo>div{position:relative;background:linear-gradient(160deg,rgba(var(--p1),.95),rgba(var(--p0),.97));color:var(--tx);padding:26px;border-radius:22px;width:min(480px,92vw);max-height:90vh;overflow:auto;border:1px solid rgba(var(--c1r),.3);box-shadow:0 30px 80px rgba(0,0,0,.7),0 0 60px rgba(var(--c2r),.28);animation:pop .25s cubic-bezier(.2,.9,.3,1.2)}
#mo h4{color:#fff;margin-top:0;font-size:18px}
@keyframes pop{from{transform:scale(.9) translateY(14px);opacity:0}to{transform:none;opacity:1}}
.ac{position:absolute;right:0;left:0;top:100%;background:rgb(var(--p1));border:1px solid rgba(var(--c1r),.35);border-radius:12px;box-shadow:0 14px 40px rgba(0,0,0,.6),0 0 24px rgba(var(--c1r),.18);max-height:240px;overflow:auto;z-index:6;display:none}
.ac div{padding:9px 13px;cursor:pointer;color:#d6e0fb}
.ac div.on,.ac div:hover{background:rgba(var(--c1r),.14);color:#fff}
.ac div.dis{color:#566590;cursor:not-allowed;background:rgba(255,255,255,.03)}
.ac .ach{color:var(--cy);font-weight:700;border-bottom:1px solid var(--bd)}
#toast{position:fixed;bottom:20px;left:20px;background:rgba(var(--p1),.92);backdrop-filter:blur(14px);color:#fff;padding:13px 22px;border-radius:14px;display:none;z-index:10;box-shadow:0 10px 36px rgba(0,0,0,.6),0 0 30px rgba(var(--c1r),.3);border:1px solid rgba(var(--c1r),.4);border-right:4px solid var(--cy)}
footer{text-align:center;padding:16px;font-size:12px;color:#5d6d96;letter-spacing:.8px}
.menu{display:none;padding:5px 10px}
#app:not(:has(*)){display:grid;place-items:center;min-height:100vh;color:var(--cy);letter-spacing:2px;animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.35}}


/* ---------- Colour swatches (Settings) ---------- */
.swr{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:10px;margin:8px 0 6px;max-width:420px}
.swr button.sw{width:100%;aspect-ratio:1;height:auto;padding:0;margin:0;border-radius:50%;border:2px solid transparent;background:var(--x);box-shadow:0 0 14px var(--x)}
.swr button.sw::after{display:none}
.swr button.sw.on{border-color:#fff;transform:scale(1.14);box-shadow:0 0 0 3px rgba(255,255,255,.2),0 0 22px var(--x)}

/* ---------- Inline-style overrides (colours set inside the JS templates) ---------- */
[style*="color:#c62828"]{color:#ff6b8b!important}
[style*="color:#667"],[style*="color:#889"]{color:var(--mu)!important}
[style*="background:#fff8e1"]{background:rgba(251,191,36,.10)!important;border:1px solid rgba(251,191,36,.35);color:#fde68a}
[style*="background:#eef3fc"]{background:rgba(var(--c1r),.12)!important;color:#a5f3fc!important;border:1px solid rgba(var(--c1r),.3)}
[style*="border:2px solid #e53935"]{border:2px solid #ff3d6e!important;box-shadow:0 0 22px rgba(255,61,110,.4)}
[style*="border:1px solid #ccc"]{border-color:var(--bd)!important}
.side img[style*="background:#fff"]{background:#fff!important}
pre{color:#cfe0ff}
a{color:var(--cy)}


/* ---------- Section separator (Settings) ---------- */
.sep{display:flex;align-items:center;gap:12px;margin:22px 0 6px;color:var(--cy);font-weight:700;font-size:13px;letter-spacing:.6px}
.sep::before,.sep::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,rgba(var(--c1r),.65),rgba(var(--c2r),.5),transparent)}
html[data-mode=light] .sep{color:#1b2a5a}
/* ---------- Top-bar mode switch ---------- */
.mt{display:inline-flex;gap:2px;padding:3px;border-radius:22px;background:rgba(var(--tn),.10);border:1px solid var(--bd);vertical-align:middle}
.top .mt button{width:auto;margin:0;padding:3px 11px;border-radius:18px;background:transparent;box-shadow:none;color:var(--mu);font-size:15px;line-height:1.5}
.top .mt button::after{display:none}
.top .mt button:hover{transform:none;box-shadow:none;filter:none;background:rgba(var(--c1r),.14)}
.top .mt button.on{background:linear-gradient(135deg,var(--t1),var(--bt2,var(--vi)));color:#fff;box-shadow:0 0 16px rgba(var(--c1r),.45)}
html[data-mode=light] .mt{background:rgba(40,70,140,.07)}

/* ================= LIGHT MODE ================= */
html[data-mode=light]{--bg:#eaf0fa;--tx:#14204a;--mu:#5a6a8e;--bd:rgba(40,70,140,.17);--gl:rgba(255,255,255,.74);--gl2:rgba(255,255,255,.6);
--sh:0 10px 34px rgba(30,60,130,.13),inset 0 1px 0 rgba(255,255,255,.9);--t1:color-mix(in srgb,var(--cy) 55%,#0f2a6b);--bt2:color-mix(in srgb,var(--vi) 72%,#101c45);color-scheme:light}
html[data-mode=light] body::before{background:radial-gradient(900px 600px at 85% -10%,rgba(var(--c2r),.22),transparent 60%),radial-gradient(800px 600px at 5% 105%,rgba(var(--c1r),.22),transparent 60%),radial-gradient(600px 400px at 50% 50%,rgba(255,255,255,.6),transparent 70%),var(--bg)}
html[data-mode=light] body::after{background-image:linear-gradient(rgba(40,70,140,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(40,70,140,.07) 1px,transparent 1px)}
html[data-mode=light]{scrollbar-color:#9db0dc #e3eaf7}
html[data-mode=light] ::-webkit-scrollbar-track{background:#e3eaf7}
html[data-mode=light] .login{box-shadow:0 0 0 1px rgba(var(--c1r),.12),0 30px 70px rgba(30,60,130,.22),0 0 70px rgba(var(--c2r),.18)}
html[data-mode=light] .login h3,html[data-mode=light] .top b{background:linear-gradient(90deg,#0c1a44,var(--bt2,var(--vi)));-webkit-background-clip:text;background-clip:text;color:transparent}
html[data-mode=light] .login img{box-shadow:0 4px 22px rgba(var(--c1r),.35);border:1px solid var(--bd)}
html[data-mode=light] input,html[data-mode=light] select,html[data-mode=light] textarea{background:rgba(255,255,255,.9);color:var(--tx);border-color:rgba(40,70,140,.22)}
html[data-mode=light] input::placeholder,html[data-mode=light] textarea::placeholder{color:#8d9bbb}
html[data-mode=light] select option{background:#fff;color:var(--tx)}
html[data-mode=light] input:focus,html[data-mode=light] select:focus,html[data-mode=light] textarea:focus{background:#fff;border-color:var(--cy);box-shadow:0 0 0 3px rgba(var(--c1r),.2),0 0 18px rgba(var(--c1r),.25)}
html[data-mode=light] input[type=date],html[data-mode=light] input[type=time],html[data-mode=light] input[type=month]{color-scheme:light}
html[data-mode=light] label{color:#2a3a68}
html[data-mode=light] button.s{background:rgba(40,70,140,.08);color:#24336a;border:1px solid var(--bd)}
html[data-mode=light] button.s:hover{background:rgba(var(--c1r),.16);border-color:rgba(var(--c1r),.6);box-shadow:0 0 16px rgba(var(--c1r),.25)}
html[data-mode=light] .side{background:linear-gradient(180deg,rgba(255,255,255,.88),rgba(238,244,255,.92));color:var(--tx);box-shadow:-10px 0 40px rgba(30,60,130,.14)}
html[data-mode=light] .side img{box-shadow:0 4px 18px rgba(var(--c1r),.3);border:1px solid var(--bd)}
html[data-mode=light] .side a{color:#3a4a78}
html[data-mode=light] .side a:hover{background:rgba(var(--c1r),.12);color:#0c1a44}
html[data-mode=light] .side a.on{background:linear-gradient(135deg,var(--t1),var(--bt2,var(--vi)));color:#fff;border-color:transparent;box-shadow:0 8px 22px rgba(var(--c2r),.38)}
html[data-mode=light] .side a.on::before{background:#fff}

function migrate9(){if(+S('schema_version','1')>=9)return false;
 const SPEC={F2:DEPTS,F3:DEPTS,F4:DEPTS},REN={},t=now();
 db.run('BEGIN');
 try{
  const facs=dbAll('SELECT id,code FROM factories');
  // managers who had every active department of a factory keep "all departments" there after the update
  const full=[];dbAll("SELECT id FROM users WHERE role='MANAGER'").forEach(u=>facs.forEach(f=>{const ds=dbAll("SELECT id FROM departments WHERE factory_id=? AND status='ACTIVE'",[f.id]);if(ds.length&&ds.every(d=>dbGet('SELECT 1 x FROM userDepartments WHERE user_id=? AND department_id=?',[u.id,d.id])))full.push([u.id,f.id])}));
  facs.forEach(f=>{const want=SPEC[f.code];if(!want)return;
   (REN[f.code]||[]).forEach(([o,n])=>{const d=dbGet('SELECT id FROM departments WHERE factory_id=? AND name=?',[f.id,o]);if(d&&!dbGet('SELECT id FROM departments WHERE factory_id=? AND name=?',[f.id,n]))dbRun('UPDATE departments SET name=?,updated_at=? WHERE id=?',[n,t,d.id])});
   want.forEach(n=>{const d=dbGet('SELECT id FROM departments WHERE factory_id=? AND name=?',[f.id,n]);if(d)dbRun("UPDATE departments SET status='ACTIVE',updated_at=? WHERE id=?",[t,d.id]);else dbRun('INSERT INTO departments(name,factory_id,created_at,updated_at) VALUES(?,?,?,?)',[n,f.id,t,t])});
   dbAll('SELECT id,name FROM departments WHERE factory_id=?',[f.id]).forEach(d=>{if(!want.includes(d.name))dbRun("UPDATE departments SET status='INACTIVE',updated_at=? WHERE id=?",[t,d.id])})});
  full.forEach(([u,f])=>dbAll("SELECT id FROM departments WHERE factory_id=? AND status='ACTIVE'",[f]).forEach(d=>dbRun('INSERT OR IGNORE INTO userDepartments(user_id,department_id) VALUES(?,?)',[u,d.id])));
  // production managers see every production section in factory 4
  dbAll("SELECT id FROM users WHERE lower(email) IN ('rnashed@intlaromatics.com','emikhail@intlaromatics.com')").forEach(u=>dbAll("SELECT d.id FROM departments d JOIN factories f ON f.id=d.factory_id WHERE f.code='F4' AND d.status='ACTIVE' AND d.name LIKE 'الانتاج%'").forEach(d=>dbRun('INSERT OR IGNORE INTO userDepartments(user_id,department_id) VALUES(?,?)',[u.id,d.id])));
  dbRun("INSERT OR REPLACE INTO settings VALUES('schema_version','9')");db.run('COMMIT');return true
 }catch(e){db.run('ROLLBACK');console.error(e);throw e}}

function wkPlan(){const mp=new Map(),ws=dbAll('SELECT id,full_name FROM workers');ws.forEach(w=>{const k=wkKey(w.full_name);if(!mp.has(k))mp.set(k,[]);mp.get(k).push(w.id)});const upd=[],add=[],bad=[],keep=new Set();
 WK_LIST.trim().split('\n').forEach(l=>{const[n,fc,dn]=l.split('|').map(x=>x.trim());if(!n)return;const d=dbGet('SELECT d.id,d.factory_id f FROM departments d JOIN factories f ON f.id=d.factory_id WHERE f.code=? AND d.name=?',[fc,dn]);if(!d){bad.push(`${n} (${fc} / ${dn})`);return}const ids=mp.get(wkKey(n))||[],o={n,ids,d:d.id,f:d.f,fc,dn};ids.forEach(i=>keep.add(i));(ids.length?upd:add).push(o)});

// ===== Biometric Attendance & Overtime module (att*) =====
// البصمة والإضافي: استيراد ملفات جهاز البصمة، التقرير اليومي، حساب الإضافي، الاستثناءات، التصدير
const ATTD={reg_end:'16:00',mult:'1.5',late:'20:00',cut:'12:00',deb:'60',buf:'3',single:'0'};
const aHM=t=>{const m=/^(\d{1,2}):(\d{2})$/.exec(String(t||'').trim());return m&&+m[1]<=24&&+m[2]<60?+m[1]*3600+ +m[2]*60:null};
const attCfg=()=>{const g=k=>S('att_'+k,ATTD[k]),mu=parseFloat(g('mult'));return{regEnd:aHM(g('reg_end'))??57600,late:aHM(g('late'))??72000,cut:aHM(g('cut'))??43200,mult:mu>0?mu:1.5,deb:Math.max(0,parseInt(g('deb'))||0),buf:Math.max(0,parseFloat(g('buf'))||0)*3600,single:g('single')==='1'}};
const aTs=s=>{const m=/^(\d{4})-(\d\d)-(\d\d)[ T](\d\d):(\d\d)(?::(\d\d))?/.exec(s);return Date.UTC(+m[1],m[2]-1,+m[3],+m[4],+m[5],+(m[6]||0))/1000};
const aDs=d=>aTs(d+' 00:00:00'),aDay=t=>Math.floor(t/86400)*86400,aFd=t=>new Date(t*1000).toISOString().slice(0,10),aFt=t=>new Date(t*1000).toISOString().slice(0,19).replace('T',' '),aHm=t=>aFt(t).slice(11,16);
const aDow=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
const aH=s=>(s/3600).toFixed(2),aHmm=s=>{const m=Math.round(s/60);return Math.floor(m/60)+':'+String(m%60).padStart(2,'0')};
const ATST={COMPLETE:'مكتمل',NO_IN:'ناقصة بصمة الحضور',NO_OUT:'ناقصة بصمة الانصراف',NO_PUNCH:'لا توجد بصمات',OPEN:'اليوم لم ينتهِ بعد'};
const ATFL={UNMATCHED:'كود غير مسجل',NO_IN:'ناقصة حضور',NO_OUT:'ناقصة انصراف',LATE_MISSING:'بصمة مفقودة بعد الحد الليلي',EARLY:'انصراف مبكر عن الوردية',SCHED:'مراجعة جدول الوردية',NO_PUNCH:'وردية بدون بصمات'};
const attOk=()=>{if(!U||!isA()){toast('غير مصرح لك بهذه العملية');return false}return true};

// ---------- Engine: يبني سجلات الحضور اليومية من البصمات الأصلية (بدون تعديلها) ----------
function attBuild(d1,d2){
 const C=attCfg(),D1=aDs(d1),D2=aDs(d2);
 const P=dbAll('SELECT worker_code c,punch_at a FROM attPunches WHERE punch_at>=? AND punch_at<? ORDER BY worker_code,punch_at',[aFt(D1-86400),aFt(D2+2*86400)]);
 const MX=dbGet('SELECT MAX(punch_at) m,MIN(punch_at) n FROM attPunches'),maxTs=MX&&MX.m?aTs(MX.m):0,minTs=MX&&MX.n?aTs(MX.n):0;
 const W={},Wi={};dbAll("SELECT w.id,w.worker_code,w.full_name,w.status,f.code fc,d.name dn FROM workers w LEFT JOIN factories f ON f.id=w.factory_id LEFT JOIN departments d ON d.id=w.department_id").forEach(w=>{Wi[w.id]=w;if(w.worker_code)W[String(w.worker_code).trim().toLowerCase()]=w});
 const SC={};dbAll("SELECT q.worker_id wid,r.request_date d,r.start_time s,r.end_time e,t.name tn FROM overtimeRequestWorkers q JOIN overtimeRequests r ON r.id=q.request_id LEFT JOIN shiftTemplates t ON t.id=r.shift_template_id WHERE r.status IN('APPROVED','ACTIVE','COMPLETED') AND r.request_date BETWEEN ? AND ?",[aFd(D1-86400),d2]).forEach(x=>{const a=aHM(x.s),b=aHM(x.e);if(a==null||b==null)return;const ds=aDs(x.d),k=x.wid+'|'+x.d;let st=ds+a,en=ds+b;if(en<=st)en+=86400;(SC[k]=SC[k]||[]).push({st,en,n:x.tn||(x.s+'→'+x.e)})});
 const CR={};dbAll('SELECT * FROM attCorrections WHERE active=1 AND att_date BETWEEN ? AND ? ORDER BY id',[d1,d2]).forEach(c=>{const k=c.worker_code+'|'+c.att_date;(CR[k]=CR[k]||{})[c.field]=c});
 const RV={};dbAll('SELECT r.*,u.name un FROM attReviews r LEFT JOIN users u ON u.id=r.user_id WHERE r.att_date BETWEEN ? AND ?',[d1,d2]).forEach(r=>RV[r.worker_code+'|'+r.att_date]=r);
 // تجميع البصمات: دمج الضغطات المتكررة خلال ثوانٍ، وربط بصمات ما بعد منتصف الليل بوردية الأمس
 const G={},byC={};let taps=0;P.forEach(p=>(byC[p.c]=byC[p.c]||[]).push(aTs(p.a)));
 for(const code of Object.keys(byC)){const w=W[code.toLowerCase()];let last=null;
  for(const t of byC[code]){const day=aDay(t);let ad=day;
   if(w){const pv=SC[w.id+'|'+aFd(day-86400)];if(pv&&pv.some(s=>s.en>day&&t<=s.en+C.buf))ad=day-86400}
   const k=code+'|'+aFd(ad),g=G[k]||(G[k]={code,ad,ts:[],taps:0});
   if(last!=null&&t-last<=C.deb){g.taps++;taps++;continue}last=t;g.ts.push(t)}}
 const cov=new Set(Object.values(G).map(g=>aFd(g.ad))),rows=[],part=minTs&&(minTs-aDay(minTs))>6*3600?aFd(minTs):'';
 const mk=(code,ad,g,w)=>{
  const date=aFd(ad),k=code+'|'+date,reg=ad+C.regEnd,lateTs=ad+C.late,sc=w?(SC[w.id+'|'+date]||[]):[];
  const sEn=sc.length?Math.max(...sc.map(s=>s.en)):0,sSt=sc.length?Math.min(...sc.map(s=>s.st)):0,raw=g?g.ts.slice():[],n=raw.length,cr=CR[k]||{};
  const r={key:k,code,name:w?w.full_name:'',wid:w?w.id:null,fc:w?w.fc||'':'',dn:w?w.dn||'':'',un:!w,date,dow:aDow[new Date(ad*1000).getUTCDay()],shift:sc.map(s=>s.n).join(' + '),sched:sc.length>0,sEn,raw,taps:g?g.taps:0,flags:[],reg,inT:null,outT:null,work:null,ot:0,otw:0,otk:'',cor:!!(cr.IN||cr.OUT),cr};
  let inT=null,outT=null,st='NO_PUNCH';
  if(n){const f=raw[0]-ad,l=raw[n-1]-ad;
   if(n===1){if(f<C.cut){inT=raw[0];st='NO_OUT'}else{outT=raw[0];st='NO_IN'}}
   else if(f>=C.cut&&!(sc.some(s=>s.st<ad+86400&&s.en>ad+86400)&&raw[n-1]>=ad+86400)){outT=raw[n-1];st='NO_IN'}
   else if(l<C.cut){inT=raw[0];st='NO_OUT'}
   else{inT=raw[0];outT=raw[n-1];st='COMPLETE'}}
  if(cr.IN)inT=aTs(cr.IN.corrected_value);if(cr.OUT)outT=aTs(cr.OUT.corrected_value);
  if(r.cor&&n)st=inT!=null&&outT!=null?'COMPLETE':inT!=null?'NO_OUT':'NO_IN';
  const conf=n>=2||!!cr.OUT||C.single;
  if(st==='NO_OUT'&&maxTs<reg)st='OPEN';
  r.st=st;r.inT=inT;r.outT=outT;
  if(st==='COMPLETE'&&outT>inT)r.work=outT-inT;
  if(outT!=null&&outT>reg&&st!=='NO_OUT'&&st!=='OPEN'){r.ot=outT-reg;r.otw=r.ot*C.mult;r.otk=conf?'C':'E'}
  const F=(sev,kk,m)=>r.flags.push({sev,k:kk,m}),lateExp=sc.length&&sEn>lateTs&&maxTs>=lateTs,anyLate=raw.some(t=>t>=lateTs)||(outT!=null&&outT>=lateTs),cutS=aHm(lateTs);
  if(!w)F('orange','UNMATCHED','كود الموظف ('+code+') غير مسجل في النظام — لم يتم تخمين هوية الموظف، يلزم المراجعة');
  if(st==='NO_OUT'&&!(lateExp&&!anyLate))F('orange','NO_OUT','ناقصة بصمة الانصراف'+(n===1?' (بصمة واحدة فقط الساعة '+aHm(raw[0])+')':''));
  if(st==='NO_IN')F('orange','NO_IN','ناقصة بصمة الحضور — أول بصمة الساعة '+aHm(raw[0])+(raw[0]-ad>=86400?' (اليوم التالي)':'')+(part&&date===part?' (ملف البصمة يبدأ من '+aHm(minTs)+' في هذا اليوم)':''));
  if(lateExp){const need=sSt>=lateTs?'بصمة الحضور':'بصمة الانصراف';
   if(!anyLate)F('red','LATE_MISSING','مطلوب '+need+' بعد '+cutS+' (وردية معتمدة: '+r.shift+' حتى '+aHm(sEn)+')'+(n?' ولم تُسجَّل':' ولا توجد أي بصمة لهذا اليوم'));
   else if(outT!=null&&outT<sEn-1800&&maxTs>=sEn)F('orange','EARLY','انصرف الساعة '+aHm(outT)+' قبل نهاية الوردية المعتمدة ('+aHm(sEn)+')')}
  else if(!n&&sc.length&&maxTs>=sEn)F('orange','NO_PUNCH','توجد سهرة معتمدة ('+r.shift+') ولا توجد بصمات في هذا اليوم');
  if(!sc.length&&outT!=null&&outT>reg&&st!=='NO_OUT'&&st!=='OPEN')F('orange','SCHED','مراجعة جدول الوردية مطلوبة: بصمة بعد '+aHm(reg)+' بدون طلب سهرات معتمد لهذا اليوم');
  if(r.otk==='E')F('orange','EST','إضافي تقديري: بصمة واحدة فقط — لا يمكن تأكيده قبل المراجعة');
  r.sev=r.flags.some(f=>f.sev==='red')?'red':r.flags.length?'orange':'';
  r.rv=RV[k]||null;r.reviewed=!!r.rv;r.open=r.flags.length>0&&!r.reviewed;
  return r};
 for(const g of Object.values(G)){if(g.ad<D1||g.ad>D2)continue;rows.push(mk(g.code,g.ad,g,W[g.code.toLowerCase()]))}
 // وردية معتمدة بدون أي بصمة في يوم مغطى بملف البصمة
 for(const k of Object.keys(SC)){const[wid,date]=k.split('|'),w=Wi[wid];if(!w||!w.worker_code||date<d1||date>d2||!cov.has(date))continue;const code=String(w.worker_code).trim().toLowerCase();if(G[code+'|'+date])continue;
  const ad=aDs(date),sEn=Math.max(...SC[k].map(s=>s.en));if(maxTs<Math.min(sEn,ad+C.late))continue;const r=mk(code,ad,null,w);if(r.flags.length)rows.push(r)}
 rows.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:a.code<b.code?-1:a.code>b.code?1:0);
 return{rows,C,maxTs,minTs,taps,part}}
function attTot(rows){const t={emps:new Set(),days:0,otC:0,otCw:0,otE:0,otEw:0,inc:0,red:0,rev:0,unm:new Set(rows.filter(r=>r.un).map(r=>r.code)).size};
 rows.filter(r=>!r.un).forEach(r=>{t.emps.add(r.code);if(r.raw.length)t.days++;if(r.otk==='C'){t.otC+=r.ot;t.otCw+=r.otw}else if(r.otk==='E'){t.otE+=r.ot;t.otEw+=r.otw}if(r.st==='NO_IN'||r.st==='NO_OUT')t.inc++;if(r.sev==='red'&&!r.reviewed)t.red++;if(r.open)t.rev++});t.emps=t.emps.size;return t}
function attEmp(rows){const m={};rows.filter(r=>!r.un).forEach(r=>{const e=m[r.code]||(m[r.code]={code:r.code,name:r.name,days:0,otC:0,otCw:0,otE:0,otEw:0,inc:0,alerts:0});if(r.raw.length)e.days++;if(r.otk==='C'){e.otC+=r.ot;e.otCw+=r.otw}else if(r.otk==='E'){e.otE+=r.ot;e.otEw+=r.otw}if(r.st==='NO_IN'||r.st==='NO_OUT')e.inc++;if(r.open)e.alerts++});return Object.values(m).sort((a,b)=>b.otC-a.otC||(a.code<b.code?-1:1))}
function attFilt(rows){const f=ATT.f,q=(f.emp||'').trim().toLowerCase();return rows.filter(r=>(!q||r.code.toLowerCase().includes(q)||r.name.toLowerCase().includes(q))&&(!f.fac||r.fc===f.fac)&&(!f.dep||r.dn===f.dep)&&(!f.shift||(f.shift==='__none'?!r.sched:r.shift.split(' + ').includes(f.shift)))&&(!f.st||r.st===f.st)&&(!f.alert||(f.alert==='red'?r.sev==='red':f.alert==='orange'?r.sev==='orange':f.alert==='none'?!r.sev:!!r.sev))&&(!f.miss||r.st==='NO_IN'||r.st==='NO_OUT'||r.st==='NO_PUNCH'||r.flags.some(x=>x.k==='LATE_MISSING'))&&(!f.ot||r.ot>0))}

 ATT={tab:m&&m.a?'sum':'imp',f:{from:m&&m.a||td,to:m&&m.b||td,emp:'',fac:'',dep:'',shift:'',st:'',alert:'',miss:0,ot:0},sort:{k:'date',d:1},pn:0,prev:null,per:'day',xs:'OPEN',map:{}}}

 let s=`<p style="font-size:13px">📅 بيانات البصمة المستوردة تغطي من <b dir="ltr">${aFt(B.minTs).slice(0,16)}</b> إلى <b dir="ltr">${aFt(B.maxTs).slice(0,16)}</b>`;
 if(B.part)s+=`<br><span style="color:#fb923c">⚠ أول يوم في الملف ناقص (يبدأ من ${aHm(B.minTs)}) — بصمات الحضور الصباحية له غير موجودة، لذلك تظهر سجلاته كـ «ناقصة بصمة الحضور». أعد تصدير اليوم كاملاً لتصحيح ذلك.</span>`;return s+'</p>'}
const attLeg=`<p style="font-size:12.5px;margin:6px 0">🟥 <b>أحمر</b>: بصمة مطلوبة بعد الحد الليلي ولم تُسجَّل (حسب الورديات المعتمدة) · 🟧 <b>برتقالي</b>: سجل ناقص أو يحتاج مراجعة يدوية · <i>~</i> إضافي تقديري (بصمة واحدة) لا يدخل في الإجمالي المؤكد</p>`;

<p style="text-align:center">${ATT.pn*PS+1}–${Math.min(rows.length,ATT.pn*PS+PS)} من ${rows.length} <button class="s" onclick="attPn(-1)"${ATT.pn?'':' disabled'}>السابق</button> <button class="s" onclick="attPn(1)"${ATT.pn<np-1?'':' disabled'}>التالي</button></p>`:empty()}</div>`}

 const K=[['الموظفون المشمولون',T.emps],['أيام الحضور المسجلة',T.days],['إضافي فعلي (مؤكد) س',aH(T.otC)],['إضافي مرجّح ×'+C.mult+' س',aH(T.otCw)],['إضافي تقديري (غير مؤكد) س',aH(T.otE)],['بصمات ناقصة',T.inc],['تنبيهات حمراء بعد '+late,T.red],['سجلات تحتاج مراجعة',T.rev],['أكواد غير مسجلة',T.unm]];

function attExcTab(){const D=attData(),xs=ATT.xs;let rows=D.rows.filter(r=>r.flags.length&&(xs==='ALL'||(xs==='OPEN'?!r.reviewed:r.reviewed)));
 rows.sort((a,b)=>(a.sev==='red'?0:1)-(b.sev==='red'?0:1)||(a.date<b.date?-1:a.date>b.date?1:0)||(a.code<b.code?-1:1));const cap=300,more=rows.length-cap;rows=rows.slice(0,cap);

function attRev(key,st){if(!attOk())return;const r=ATT.map[key];if(!r)return;
 if(st==='OPEN')return confirmBox('إعادة فتح هذا الاستثناء؟',async()=>{await dbTransaction(()=>{dbRun('DELETE FROM attReviews WHERE worker_code=? AND att_date=?',[r.code,r.date]);audit('ATT_REVIEW','attendance',key,r.rv?.status,'OPEN','إعادة فتح')});toast('تمت إعادة فتح الاستثناء');shell('att')});
 modal(`<h4>${st==='RESOLVED'?'تمت المعالجة':'تجاهل الاستثناء'} — <span dir="ltr">${esc(r.code)}</span> ${esc(r.name)} (${r.date})</h4><label>ملاحظة المراجعة ${st==='DISMISSED'?'(إلزامية)':''}</label><textarea id="arn" rows="3"></textarea><button id="arb">حفظ</button> <button class="s" onclick="closeM()">إلغاء</button>`);
 arb.onclick=()=>{const n=arn.value.trim();if(st==='DISMISSED'&&!n)return toast('اكتب سبب التجاهل');act(()=>{dbRun('INSERT OR REPLACE INTO attReviews(worker_code,att_date,status,note,user_id,reviewed_at) VALUES(?,?,?,?,?,?)',[r.code,r.date,st,n,U.id,now()]);audit('ATT_REVIEW','attendance',key,'OPEN',st,n)},'att')}}
function attCor(key){if(!attOk())return;const r=ATT.map[key];if(!r)return;const dt=t=>t==null?'':aFt(t).slice(0,16).replace(' ','T'),cs=dbAll('SELECT c.*,u.name un FROM attCorrections c LEFT JOIN users u ON u.id=c.user_id WHERE worker_code=? AND att_date=? ORDER BY c.id DESC',[r.code,r.date]);
 modal(`<h4>تصحيح سجل — <span dir="ltr">${esc(r.code)}</span> ${esc(r.name)} (${r.date})</h4><p style="font-size:13px">البصمات الأصلية (لا تتغير): <b dir="ltr">${r.raw.length?r.raw.map(t=>aFt(t).slice(5,16)).join(' · '):'لا يوجد'}</b><br>التصحيح يُحفظ كسجل مستقل مع السبب والمستخدم، ويمكن إلغاؤه.</p>
<label>وقت الحضور بعد التصحيح</label><input type="datetime-local" id="ci" value="${dt(r.inT)}"><label>وقت الانصراف بعد التصحيح</label><input type="datetime-local" id="co" value="${dt(r.outT)}"><label>سبب التصحيح (إلزامي)</label><textarea id="cr" rows="2"></textarea>
<button id="cb">حفظ التصحيح</button> <button class="s" onclick="closeM()">إلغاء</button>${cs.length?`<h4 style="margin-top:14px">سجل التصحيحات</h4><table><tr><th>الحقل</th><th>الأصلي</th><th>المصحح</th><th>السبب</th><th>المستخدم</th><th></th></tr>${cs.map(c=>`<tr style="${c.active?'':'opacity:.5'}"><td>${c.field==='IN'?'حضور':'انصراف'}</td><td dir="ltr">${esc(c.original_value||'—')}</td><td dir="ltr">${esc(c.corrected_value)}</td><td>${esc(c.reason)}</td><td>${esc(c.un||'')}</td><td>${c.active?`<button class="s" onclick="attUncor(${c.id},'${esc(key)}')">إلغاء</button>`:'ملغى'}</td></tr>`).join('')}</table>`:''}`);
 cb.onclick=()=>{const why=cr.value.trim(),vi=ci.value,vo=co.value;if(!why)return toast('اكتب سبب التصحيح');const ch=[];if(vi&&vi!==dt(r.inT))ch.push(['IN',vi.replace('T',' ')+':00',r.raw.length?aFt(r.raw[0]):null]);if(vo&&vo!==dt(r.outT))ch.push(['OUT',vo.replace('T',' ')+':00',r.raw.length?aFt(r.raw[r.raw.length-1]):null]);
  if(!ch.length)return toast('لم يتم تغيير أي وقت');const ni=vi?aTs(vi.replace('T',' ')):r.inT,no=vo?aTs(vo.replace('T',' ')):r.outT;if(ni!=null&&no!=null&&no<=ni)return toast('وقت الانصراف يجب أن يكون بعد وقت الحضور');
  act(()=>{ch.forEach(([f,v,o])=>{dbRun('UPDATE attCorrections SET active=0 WHERE worker_code=? AND att_date=? AND field=?',[r.code,r.date,f]);dbRun('INSERT INTO attCorrections(worker_code,att_date,field,original_value,corrected_value,reason,user_id,active,created_at) VALUES(?,?,?,?,?,?,?,1,?)',[r.code,r.date,f,o,v,why,U.id,now()]);audit('ATT_CORRECT','attendance',key,f+': '+(o||'-'),f+': '+v,why)})},'att')}}
function attUncor(id,key){if(!attOk())return;const c=dbGet('SELECT * FROM attCorrections WHERE id=?',[id]);if(!c)return;act(()=>{dbRun('UPDATE attCorrections SET active=0 WHERE id=?',[id]);audit('ATT_CORRECT_UNDO','attendance',key,c.field+': '+c.corrected_value,null,'إلغاء تصحيح')},'att','تم إلغاء التصحيح')}
