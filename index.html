const idbGet=async()=>{const d=await IDB();return new Promise(r=>{const q=d.transaction('s').objectStore('s').get('db');q.onsuccess=()=>r(q.result)})};
const idbSet=async(v,k='db')=>{const d=await IDB();return new Promise(r=>{const t=d.transaction('s','readwrite');t.objectStore('s').put(v,k);t.oncomplete=r})};

const b64=u=>{let s='';for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s)};
const unb64=t=>{const b=atob(t.replace(/\s/g,'')),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u};
class GHHandle{
 constructor(c){this.c=c;this.name='GitHub: '+c.repo+'/'+c.path;this.gh=true;this.sha='';this.etag='';this.bytes=new Uint8Array(0);this.skip=false}
 get url(){return`https://api.github.com/repos/${this.c.repo}/contents/${this.c.path.split('/').map(encodeURIComponent).join('/')}`}
 hd(x){return{Authorization:'Bearer '+this.c.token,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28',...x}}
 async queryPermission(){return'granted'}
 async requestPermission(){return'granted'}
 file(){const b=this.bytes;return{lastModified:this.sha,size:b.length,arrayBuffer:async()=>b.slice().buffer}}
 async getFile(){if(this.skip){this.skip=false;return this.file()}
  const h=this.hd();if(this.etag)h['If-None-Match']=this.etag;const q='?ref='+encodeURIComponent(this.c.branch);
  const r=await fetch(this.url+q,{headers:h,cache:'no-store'});
  if(r.status===304)return this.file();
  if(r.status===404){this.sha='';this.etag='';this.bytes=new Uint8Array(0);return this.file()}
  if(!r.ok)throw new Error('GitHub HTTP '+r.status+(r.status===401?' (المفتاح غير صالح أو منتهي)':''));
  const j=await r.json();this.etag=r.headers.get('ETag')||'';this.sha=j.sha;
  if(j.content&&j.encoding==='base64')this.bytes=unb64(j.content);
  else{const rr=await fetch(this.url+q,{headers:this.hd({Accept:'application/vnd.github.raw+json'}),cache:'no-store'});if(!rr.ok)throw new Error('GitHub HTTP '+rr.status);this.bytes=new Uint8Array(await rr.arrayBuffer())}
  return this.file()}
 async createWritable(){const me=this;let d=null;return{write:async x=>{d=x},close:async()=>{await me.put(d)}}}
 async put(bytes){const body={message:'AFF DB update '+new Date().toISOString(),content:b64(bytes),branch:this.c.branch};if(this.sha)body.sha=this.sha;
  const r=await fetch(this.url,{method:'PUT',headers:this.hd({'Content-Type':'application/json'}),body:JSON.stringify(body),cache:'no-store'});
  if(r.status===409||r.status===422){this.etag='';throw new Error('CONFLICT')}
  if(!r.ok)throw new Error('GitHub HTTP '+r.status+' '+(await r.text()).slice(0,120));
  const j=await r.json();this.sha=j.content.sha;this.bytes=new Uint8Array(bytes);this.etag='';this.skip=true}}
const validBin=bin=>{try{const t=new SQL.Database(bin),nm=t.exec("SELECT name FROM sqlite_master WHERE type='table'")[0].values.flat();t.close();return REQ.every(x=>nm.includes(x))}catch(e){return false}};
async function writeFile(){const w=await FH.createWritable();await w.write(db.export());await w.close();FMOD=(await FH.getFile()).lastModified}
async function syncFromFile(force){if(!FH)return false;const f=await FH.getFile();if(!force&&f.lastModified===FMOD)return false;const bin=new Uint8Array(await f.arrayBuffer());if(bin.length<100)return false;const nd=new SQL.Database(bin);db.close();db=nd;db.run('PRAGMA foreign_keys=ON');FMOD=f.lastModified;return true}
async function saveDatabase(strict){if(FH){const f=await FH.getFile();if(FMOD&&f.lastModified!==FMOD&&f.size>100){await syncFromFile(true);if(strict)throw new Error('CONFLICT');return}try{await writeFile()}catch(e){if(String(e).includes('CONFLICT')){try{await syncFromFile(true)}catch(_){}if(strict)throw e;return}throw e}}await idbSet(db.export())}
async function dbTransaction(f){try{await syncFromFile()}catch(e){console.error(e)}db.run('BEGIN');try{f();db.run('COMMIT')}catch(e){db.run('ROLLBACK');console.error(e);throw e}await saveDatabase(true)}

const REQ=['users','factories','departments','workers','drivers','vehicles','shiftTemplates','overtimeRequests','overtimeRequestWorkers','notifications','reports','settings','auditLogs'];
async function settings(){const sz=(db.export().length/1048576).toFixed(2),lb=await idbGetK('lastBackup');
 pg.innerHTML=settingsForm()+`<div class="box"><p>حالة قاعدة البيانات: ${FH?'🔗 مشتركة ('+esc(FH.name)+')':'✔ SQLite محلية'} · الحجم: ${sz} MB · آخر نسخة احتياطية: ${lb||'لم يتم إنشاء نسخة احتياطية بعد'}</p><button onclick="backupDatabase()">تصدير قاعدة SQLite</button><button class="s" onclick="unlinkDb()">تغيير وضع التخزين / ملف قاعدة البيانات</button><label>استعادة نسخة (.sqlite/.db)</label><input type="file" id="rf" accept=".sqlite,.db"></div>`;rf.onchange=()=>restoreDatabase(rf.files[0]);sv.onclick=saveSettings}
const idbGetK=async k=>{const d=await IDB();return new Promise(r=>{const q=d.transaction('s').objectStore('s').get(k);q.onsuccess=()=>r(q.result)})};
async function backupDatabase(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([db.export()]));a.download=`AFF_Workers_Overtime_Backup_${new Date().toISOString().slice(0,10)}.sqlite`;a.click();const t=new Date().toLocaleString('ar-EG');await idbSet(t,'lastBackup');audit('BACKUP','database','');await saveDatabase();toast('تم حفظ البيانات بنجاح');settings()}
async function restoreDatabase(f){if(!f)return;try{const bin=new Uint8Array(await f.arrayBuffer()),t=new SQL.Database(bin),names=t.exec("SELECT name FROM sqlite_master WHERE type='table'")[0].values.flat();
 if(REQ.some(r=>!names.includes(r)))throw 0;t.close();confirmBox('سيتم استبدال قاعدة البيانات الحالية بالكامل. هل أنت متأكد؟',async()=>{await idbSet(db.export(),'autoBackup');await idbSet(bin);if(FH){db=new SQL.Database(bin);await writeFile()}location.reload()})}catch(e){toast('ملف قاعدة البيانات غير صالح أو لا يتوافق مع النظام.')}}
// ===== Migration & default shifts =====
const DEF_SHIFTS=[['4 PM → 7:30 PM','16:00','19:30'],['7:30 PM → 12 AM','19:30','00:00'],['4 PM → 6 AM','16:00','06:00']];
function addDefaultShifts(){DEF_SHIFTS.forEach(x=>dbRun('INSERT INTO shiftTemplates(name,start_time,end_time,created_at,updated_at) VALUES(?,?,?,?,?)',[...x,now(),now()]))}
function migrate(){const v=+(dbGet("SELECT value v FROM settings WHERE key='schema_version'")?.v||1);if(v>=2)return false;
 ['drivers','vehicles'].forEach(t=>{if(!dbAll(`PRAGMA table_info(${t})`).some(c=>c.name==='area'))db.run(`ALTER TABLE ${t} ADD COLUMN area TEXT`)});
 db.run("DELETE FROM shiftTemplates WHERE id NOT IN (SELECT shift_template_id FROM overtimeRequests WHERE shift_template_id IS NOT NULL)");addDefaultShifts();
 db.run("INSERT OR REPLACE INTO settings VALUES('schema_version','2')");return true}

  if(id&&role!==u.role){if(lastAdm(id))return toast(LAW);if(id===U.id)return toast('لا يمكنك تغيير دور حسابك الحالي')}

  act(()=>{id?dbRun('UPDATE users SET name=?,email=?,role=?,factory_id=?,updated_at=? WHERE id=?',[n,e,role,fid,t,id]):dbRun('INSERT INTO users(name,email,password_hash,role,factory_id,created_at,updated_at) VALUES(?,?,?,?,?,?,?)',[n,e,h,role,fid,t,t]);audit(id?'UPDATE':'CREATE','user',id||e)},'users')}}
function uPw(id){modal(`<h4>إعادة تعيين كلمة المرور</h4><input id="np" type="password" dir="ltr" placeholder="كلمة المرور الجديدة (6 أحرف على الأقل)"><button id="uy">حفظ</button> <button class="s" onclick="closeM()">إلغاء</button>`);
 uy.onclick=async()=>{if(np.value.length<6)return toast('البيانات غير صحيحة');const h=await hash(np.value);act(()=>{dbRun('UPDATE users SET password_hash=?,updated_at=? WHERE id=?',[h,now(),id]);audit('PASSWORD_RESET','user',id)},'users','تم تغيير كلمة المرور')}}
const uTog=id=>{const u=dbGet('SELECT status FROM users WHERE id=?',[id]);if(u.status==='ACTIVE'&&lastAdm(id))return toast(LAW);act(()=>{TOG('users',id);audit(u.status==='ACTIVE'?'DEACTIVATE':'ACTIVATE','user',id)},'users')};
const uDel=id=>{if(lastAdm(id))return toast(LAW);if(id===U.id)return toast('لا يمكنك حذف حسابك الحالي');confirmBox('هل أنت متأكد من حذف هذا المستخدم؟',()=>act(()=>{dbRun('DELETE FROM notifications WHERE user_id=?',[id]);dbRun('DELETE FROM users WHERE id=?',[id]);audit('DELETE','user',id)},'users','تم حذف السجل'))};

function fl(){const r=dbAll('SELECT * FROM factories WHERE code LIKE ? OR name LIKE ? ORDER BY code',['%'+fq.value+'%','%'+fq.value+'%']);
 ft.innerHTML=r.length?`<table><tr><th>الكود</th><th>الاسم</th><th>الوصف</th><th>الحالة</th><th></th></tr>${r.map(f=>`<tr><td dir="ltr">${esc(f.code)}</td><td>${esc(f.name)}</td><td>${esc(f.description||'')}</td><td>${stTxt(f.status)}</td><td><button class="s" onclick="fEdit(${f.id})">تعديل</button> <button class="s" onclick="act(()=>{TOG('factories',${f.id});audit('TOGGLE','factory',${f.id})},'fac')">تفعيل/إيقاف</button> <button class="d" onclick="fDel(${f.id})">حذف</button></td></tr>`).join('')}</table>`:empty()}
function fEdit(id){const f=id?dbGet('SELECT * FROM factories WHERE id=?',[id]):{code:'',name:'',description:''};
 modal(`<h4>${id?'تعديل':'إضافة'} مصنع</h4><label>الكود (فريد)</label><input id="fc" dir="ltr" value="${esc(f.code)}"><label>الاسم</label><input id="fn" value="${esc(f.name)}"><label>الوصف</label><input id="fd" value="${esc(f.description||'')}"><button id="fy">حفظ</button> <button class="s" onclick="closeM()">إلغاء</button>`);
 fy.onclick=()=>{const c=fc.value.trim().toUpperCase(),n=fn.value.trim(),t=now();if(!c||!n)return toast('البيانات غير صحيحة');
  act(()=>{id?dbRun('UPDATE factories SET code=?,name=?,description=?,updated_at=? WHERE id=?',[c,n,fd.value,t,id]):dbRun('INSERT INTO factories(code,name,description,created_at,updated_at) VALUES(?,?,?,?,?)',[c,n,fd.value,t,t]);audit(id?'UPDATE':'CREATE','factory',id||c)},'fac')}}
const fDel=id=>confirmBox('هل أنت متأكد من حذف هذا المصنع؟',()=>act(()=>{dbRun('DELETE FROM factories WHERE id=?',[id]);audit('DELETE','factory',id)},'fac','تم حذف السجل'));

function dl(){const r=dbAll("SELECT d.*,f.code fc FROM departments d JOIN factories f ON f.id=d.factory_id WHERE d.name LIKE ? AND (?='' OR d.factory_id=?) ORDER BY f.code,d.name",['%'+dq.value+'%',dff.value,+dff.value||0]);
 dt.innerHTML=r.length?`<table><tr><th>القسم</th><th>المصنع</th><th>الحالة</th><th></th></tr>${r.map(d=>`<tr><td>${esc(d.name)}</td><td>${d.fc}</td><td>${stTxt(d.status)}</td><td><button class="s" onclick="dEdit(${d.id})">تعديل</button> <button class="s" onclick="act(()=>{TOG('departments',${d.id});audit('TOGGLE','department',${d.id})},'dep')">تفعيل/إيقاف</button> <button class="d" onclick="dDel(${d.id})">حذف</button></td></tr>`).join('')}</table>`:empty()}
function dEdit(id){const d=id?dbGet('SELECT * FROM departments WHERE id=?',[id]):{name:'',factory_id:0};
 modal(`<h4>${id?'تعديل':'إضافة'} قسم</h4><label>اسم القسم</label><input id="dn" value="${esc(d.name)}"><label>المصنع</label><select id="dfx">${dbAll('SELECT id,code FROM factories WHERE status="ACTIVE"').map(f=>`<option value="${f.id}" ${f.id===d.factory_id?'selected':''}>${f.code}</option>`).join('')}</select><button id="dy">حفظ</button> <button class="s" onclick="closeM()">إلغاء</button>`);
 dy.onclick=()=>{const n=dn.value.trim(),f=+dfx.value,t=now();if(!n||!f)return toast('البيانات غير صحيحة');
  act(()=>{id?dbRun('UPDATE departments SET name=?,factory_id=?,updated_at=? WHERE id=?',[n,f,t,id]):dbRun('INSERT INTO departments(name,factory_id,created_at,updated_at) VALUES(?,?,?,?)',[n,f,t,t]);audit(id?'UPDATE':'CREATE','department',id||n)},'dep')}}
const dDel=id=>confirmBox('هل أنت متأكد من حذف هذا القسم؟',()=>act(()=>{dbRun('DELETE FROM departments WHERE id=?',[id]);audit('DELETE','department',id)},'dep','تم حذف السجل'));
function migrate4(){if(+S('schema_version','1')>=4)return false;const cols=t=>dbAll(`PRAGMA table_info(${t})`).map(c=>c.name);
 if(!cols('drivers').includes('vehicle_id'))db.run('ALTER TABLE drivers ADD COLUMN vehicle_id INTEGER');
 if(!cols('overtimeRequests').includes('area_id'))db.run('ALTER TABLE overtimeRequests ADD COLUMN area_id INTEGER');
 if(!dbGet('SELECT COUNT(*) c FROM areas').c)['الغربنيات','اسكندرية','موقف','الادارة','عبد القادر','بهيج','مدينة برج العرب','المنطقة الثانيه','العجمى'].forEach(a=>dbRun('INSERT INTO areas(name,created_at,updated_at) VALUES(?,?,?)',[a,now(),now()]));
 dbRun("INSERT OR REPLACE INTO settings VALUES('schema_version','4')");return true}
function migrate5(){if(+S('schema_version','1')>=5)return false;const c=dbAll('PRAGMA table_info(overtimeRequestWorkers)').map(x=>x.name);
 ['driver_id','vehicle_id','area_id'].forEach(k=>{if(!c.includes(k))db.run(`ALTER TABLE overtimeRequestWorkers ADD COLUMN ${k} INTEGER`)});dbRun("INSERT OR REPLACE INTO settings VALUES('schema_version','5')");return true}
function migrate3(){if(+S('schema_version','1')>=3)return false;const have=new Set(dbAll('SELECT full_name FROM workers').map(x=>x.full_name));
 WORKERS.forEach(n=>{if(!have.has(n))dbRun('INSERT INTO workers(full_name,created_at,updated_at) VALUES(?,?,?)',[n,now(),now()])});dbRun("INSERT OR REPLACE INTO settings VALUES('schema_version','3')");return true}
// ===== Settings =====
function applyTheme(){const r=document.documentElement.style;r.setProperty('--b',S('c1','#0b2a5b'));r.setProperty('--a',S('c2','#1e6fd9'))}
const NT=[['NEW','طلب جديد'],['APPROVED','موافقة'],['REJECTED','رفض'],['DRIVER','تعيين سائق'],['ACTIVE','بدء السهرة'],['COMPLETED','انتهاء السهرة']];
function settingsForm(){return `<div class="box"><h4>إعدادات النظام</h4><label>اسم الشركة</label><input id="sc" value="${esc(S('company','Aromatic Flavours & Fragrances (AFF)'))}"><label>رابط الشعار</label><input id="sl" dir="ltr" value="${esc(S('logo',LOGO))}"><label>الحد الأقصى لساعات السهر للعامل في اليوم</label><input id="sm" type="number" min="1" max="24" value="${S('max_h','12')}"><label>لون الثيم الأساسي</label><input id="c1" type="color" value="${S('c1','#0b2a5b')}"><label>لون التمييز</label><input id="c2" type="color" value="${S('c2','#1e6fd9')}"><label>الإشعارات المفعّلة</label>${NT.map(([k,v])=>`<label style="font-weight:400"><input type="checkbox" class="nt" data-k="${k}" ${S('n_'+k,'1')==='1'?'checked':''}> ${v}</label>`).join('')}<button id="sv">حفظ الإعدادات</button></div>`}
function saveSettings(){const m=+sm.value;if(!sc.value.trim()||!(m>=1&&m<=24))return toast('البيانات غير صحيحة');
 const kv=[['company',sc.value.trim()],['logo',sl.value.trim()||LOGO],['max_h',String(m)],['c1',c1.value],['c2',c2.value],...[...document.querySelectorAll('.nt')].map(x=>['n_'+x.dataset.k,x.checked?'1':'0'])];
 act(()=>{kv.forEach(x=>dbRun('INSERT OR REPLACE INTO settings VALUES(?,?)',x));LOGO=sl.value.trim()||LOGO;applyTheme();audit('SETTINGS','settings','',null,JSON.stringify(Object.fromEntries(kv)))},'set')}
// ===== Init =====
// ===== Shared database mode (File System Access API) + auto refresh =====
const initLast=()=>{LASTN=dbGet('SELECT COALESCE(MAX(id),0) m FROM notifications WHERE user_id=?',[U.id]).m;LASTR=dbGet('SELECT COALESCE(MAX(id),0) m FROM overtimeRequests').m};
async function unlinkDb(){confirmBox('سيتم فصل هذا الجهاز عن الملف الحالي وإظهار شاشة اختيار الملف. هل أنت متأكد؟',async()=>{await idbSet(null,'fh');await idbSet(null,'local');await idbSet(null,'gh');location.reload()})}
function dbInfo(){modal(`<h4>حالة قاعدة البيانات</h4><p>${FH?'🔗 متصل بالملف المشترك: <b dir="ltr">'+esc(FH.name)+'</b><br>آخر تحديث: '+(LSYNC||'-'):'💻 هذا الجهاز يعمل بقاعدة بيانات محلية ولا يتزامن مع الأجهزة الأخرى.'}</p><button onclick="closeM();unlinkDb()">${FH?'تغيير الملف':'ربط بملف مشترك'}</button> <button class="s" onclick="closeM()">إغلاق</button>`)}
async function poll(force){if(!U)return;let ch=false;try{ch=await syncFromFile()}catch(e){console.error(e)}
 LSYNC=new Date().toLocaleTimeString('ar-EG');const sy=document.getElementById('sy');if(sy)sy.textContent=LSYNC;
 if(isA()){try{const r=dbAll("SELECT id,request_number FROM overtimeRequests WHERE status='PENDING' AND id>? ORDER BY id",[LASTR]);if(r.length){LASTR=r[r.length-1].id;ch=true;toast('🔔 طلب سهرات جديد بانتظار الموافقة: '+r[r.length-1].request_number)}
  const miss=dbAll("SELECT r.id FROM overtimeRequests r WHERE r.status='PENDING' AND NOT EXISTS(SELECT 1 FROM notifications n WHERE n.request_id=r.id AND n.user_id=? AND n.type='NEW')",[U.id]);
  if(miss.length&&S('n_NEW','1')!=='0'){miss.forEach(m=>notify(U.id,m.id,'طلب جديد','يوجد طلب سهرات جديد بانتظار الموافقة','NEW'));await saveDatabase()}}catch(e){console.error(e)}}
 const n=dbAll('SELECT id,message FROM notifications WHERE user_id=? AND is_read=0 AND id>? ORDER BY id',[U.id,LASTN]);if(n.length){LASTN=n[n.length-1].id;toast('🔔 '+n[n.length-1].message)}
 await shiftTick();const b=document.getElementById('bell');if(b)b.textContent='🔔 '+dbGet('SELECT COUNT(*) c FROM notifications WHERE user_id=? AND is_read=0',[U.id]).c;
 if(CUR==='rep'&&RPT&&document.getElementById('rtype')){if((force||ch||n.length)&&document.getElementById('mo').style.display!=='flex')runReport();return}
 const busy=document.getElementById('mo').style.display==='flex'||CUR==='new'||/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName||'');
 if(force?(CUR!=='new'&&document.getElementById('mo').style.display!=='flex'):((ch||n.length)&&!busy))shell(CUR)}
async function loadLocal(){const saved=await idbGet();db=saved?new SQL.Database(saved):new SQL.Database()}
async function openShared(){const f=await FH.getFile();if(f.size>100){db=new SQL.Database(new Uint8Array(await f.arrayBuffer()));FMOD=f.lastModified}else await loadLocal();await boot();if(f.size<=100)await saveDatabase()}
async function boot(){db.run(SCHEMA);if(!dbGet('SELECT COUNT(*) c FROM users').c)await seed();const m1=migrate(),m3=migrate3(),m4=migrate4(),m5=migrate5();if(m1||m3||m4||m5)await saveDatabase();LOGO=S('logo',LOGO);applyTheme();
 let LA=Date.now();['click','keydown'].forEach(e=>addEventListener(e,()=>LA=Date.now()));setInterval(()=>{if(U&&Date.now()-LA>18e5){toast('انتهت الجلسة لعدم النشاط');logout()}},60000);setInterval(poll,20000);
 const s=sessionStorage.getItem('u');if(s){U=JSON.parse(s);initLast();shell('dash');shiftTick()}else loginView()}
function connectView(msg){const fs=!!window.showSaveFilePicker;document.getElementById('app').innerHTML=`<div class="login"><img src="${LOGO}" height="60" alt="AFF"><h3>قاعدة البيانات المشتركة</h3><p>${msg||(fs?'لتشغيل النظام من أكثر من جهاز، اختر ملف قاعدة البيانات داخل المجلد المشترك (نفس الملف على كل الأجهزة).':'المتصفح لا يدعم الملفات المشتركة. استخدم Chrome أو Edge على الكمبيوتر.')}</p>${FH?'<button id="b0">إعادة الاتصال</button>':fs?'<button id="b1">إنشاء ملف قاعدة بيانات جديد</button><button id="b2" class="s">فتح ملف قاعدة بيانات موجود</button>':''}<button id="b5">☁ الربط بقاعدة بيانات على GitHub (موصى به)</button>${location.protocol!=='file:'?'<button class="s" id="b4">تحميل قاعدة البيانات من الموقع مباشرة (AFF_Workers_Overtime.sqlite)</button>':''}<button class="s" id="b3">العمل محلياً على هذا الجهاز فقط</button></div>`;
 const go=f=>async()=>{try{await f()}catch(e){if(e.name!=='AbortError'){console.error(e);toast('تعذر فتح الملف: '+e.message)}}};
 if(FH)b0.onclick=go(async()=>{if(await FH.requestPermission({mode:'readwrite'})!=='granted')return toast('يجب السماح بالكتابة على الملف');await openShared()});
 if(!FH&&fs){b1.onclick=go(async()=>{FH=await showSaveFilePicker({suggestedName:'AFF_Workers_Overtime.sqlite',types:FTYPES});await idbSet(FH,'fh');await openShared()});
  b2.onclick=go(async()=>{const[h]=await showOpenFilePicker({types:FTYPES});if(await h.requestPermission({mode:'readwrite'})!=='granted')return toast('يجب السماح بالكتابة على الملف');
   try{const t=new SQL.Database(new Uint8Array(await(await h.getFile()).arrayBuffer())),nm=t.exec("SELECT name FROM sqlite_master WHERE type='table'")[0].values.flat();t.close();if(REQ.some(r=>!nm.includes(r)))throw 0}catch(e){return toast('ملف قاعدة البيانات غير صالح أو لا يتوافق مع النظام.')}
   FH=h;await idbSet(h,'fh');await openShared()})}
 b3.onclick=go(async()=>{await idbSet(1,'local');FH=null;await loadLocal();await boot()});
 document.getElementById('b5').onclick=go(async()=>{const old=await idbGetK('gh').catch(()=>null)||{},mh=location.hostname.match(/^(.+)\.github\.io$/),dr=old.repo||(mh?mh[1]+'/'+(location.pathname.split('/')[1]||''):'');
  modal(`<h4>الربط بقاعدة بيانات على GitHub</h4><p style="font-size:13px;color:#667">أنشئ مفتاحًا: GitHub ← Settings ← Developer settings ← Fine-grained tokens. اختر مستودع قاعدة البيانات فقط، وصلاحية <b>Contents: Read and write</b>. الأفضل مستودع <b>Private</b> منفصل لقاعدة البيانات.</p><label>المستودع (owner/repo)</label><input id="g1" dir="ltr" value="${esc(dr)}" placeholder="owner/repo"><label>مسار الملف</label><input id="g2" dir="ltr" value="${esc(old.path||'AFF_Workers_Overtime.sqlite')}"><label>الفرع</label><input id="g3" dir="ltr" value="${esc(old.branch||'main')}"><label>مفتاح الوصول (Token)</label><input id="g4" type="password" dir="ltr"><button id="g5">اختبار وحفظ</button> <button class="s" onclick="closeM()">إلغاء</button>`);
  g5.onclick=go(async()=>{const cfg={repo:g1.value.trim(),path:g2.value.trim().replace(/^\/+/,''),branch:g3.value.trim()||'main',token:g4.value.trim()};
   if(!/^[\w.-]+\/[\w.-]+$/.test(cfg.repo)||!cfg.path||!cfg.token)return toast('البيانات غير صحيحة');g5.disabled=true;g5.textContent='جاري الاختبار...';
   try{const rr=await fetch('https://api.github.com/repos/'+cfg.repo,{headers:{Authorization:'Bearer '+cfg.token,Accept:'application/vnd.github+json'},cache:'no-store'});if(!rr.ok)throw new Error('تعذر الوصول للمستودع (HTTP '+rr.status+') - تأكد من اسم المستودع والمفتاح');
    const rj=await rr.json();if(rj.permissions&&!rj.permissions.push)throw new Error('المفتاح لا يملك صلاحية الكتابة (Contents: Read and write)');
    const h=new GHHandle(cfg),f=await h.getFile();if(f.size>100&&!validBin(new Uint8Array(await f.arrayBuffer())))throw new Error('الملف في المستودع ليس قاعدة بيانات صالحة لهذا النظام');
    await idbSet(cfg,'gh');FH=h;closeM();await openShared()}catch(e){g5.disabled=false;g5.textContent='اختبار وحفظ';throw e}})});
 const b4=document.getElementById('b4');if(b4)b4.onclick=go(async()=>{const urls=['AFF_Workers_Overtime.sqlite'],mh=location.hostname.match(/^(.+)\.github\.io$/);if(mh)urls.push(`https://raw.githubusercontent.com/${mh[1]}/${location.pathname.split('/')[1]}/main/AFF_Workers_Overtime.sqlite`);
  let bin=null,err='';for(const u of urls){try{const r=await fetch(u,{cache:'no-store'});if(!r.ok){err+='HTTP '+r.status+' ← '+u+'\n';continue}const x=new Uint8Array(await r.arrayBuffer());if(x.length>100&&String.fromCharCode(...x.slice(0,15))==='SQLite format 3'){bin=x;break}err+='ليس ملف SQLite ← '+u+'\n'}catch(e){err+=e.message+' ← '+u+'\n'}}
  if(!bin){modal('<h4>تعذر تحميل قاعدة البيانات من الموقع</h4><pre dir="ltr" style="white-space:pre-wrap;font-size:12px">'+esc(err)+'</pre><button onclick="closeM()">إغلاق</button>');return}
  let ok=false;try{const t=new SQL.Database(bin),nm=t.exec("SELECT name FROM sqlite_master WHERE type='table'")[0].values.flat();t.close();ok=REQ.every(x=>nm.includes(x))}catch(e){}
  if(!ok)return toast('ملف قاعدة البيانات المرفوع غير صالح أو فارغ.');
  await idbSet(bin);await idbSet(1,'local');FH=null;await loadLocal();await boot()})}
async function init(){try{SQL=await initSqlJs({locateFile:f=>WASM+f});const gcfg=await idbGetK('gh').catch(()=>null);FH=gcfg?new GHHandle(gcfg):await idbGetK('fh').catch(()=>null);
 if(FH){if(await FH.queryPermission({mode:'readwrite'})==='granted')await openShared();else connectView('اضغط لإعادة الاتصال بملف قاعدة البيانات المشتركة')}
 else if(window.showSaveFilePicker&&!(await idbGetK('local')))connectView();else{await loadLocal();await boot()}}
 catch(e){console.error(e);if(FH){const g=FH.gh;FH=null;if(!g)await idbSet(null,'fh');return connectView('تعذر فتح قاعدة البيانات: '+e.message)}document.getElementById('app').innerHTML='<div class="login"><h3>تعذر تشغيل قاعدة البيانات المحلية.</h3><p>تأكد من الاتصال بالإنترنت لتحميل مكتبة SQLite ثم أعد المحاولة.</p><button onclick="location.reload()">إعادة المحاولة</button></div>'}}
init();
</script></body></html>
